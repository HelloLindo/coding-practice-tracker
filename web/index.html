<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="practice-token" content="__PRACTICE_TOKEN__">
  <title>Coding Practice Tracker · Local journal</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/js/theme.js"></script>
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <aside class="sidebar" aria-label="Problems">
    <a class="brand" href="#/new" aria-label="Coding Practice Tracker home"><span class="brand-mark">{ }</span><span>practice<span class="brand-caption">YOUR CODING JOURNAL</span></span></a>
    <nav class="primary-nav" aria-label="Main">
      <a class="nav-link" href="#/new" data-route="new"><span aria-hidden="true">＋</span> New practice</a>
      <a class="nav-link" href="#/review" data-route="review"><span aria-hidden="true">◎</span> Review</a>
    </nav>
    <div class="sidebar-tools">
      <input id="problem-search" type="search" placeholder="Search titles, notes, code" aria-label="Search problems, notes, and code" autocomplete="off">
      <button id="filter-toggle" class="filter-toggle" type="button" aria-expanded="false" aria-controls="filters">Filter &amp; sort<span id="filter-badge" class="badge" hidden></span></button>
      <div id="filters" class="filters" hidden>
        <label>Platform<select id="filter-platform"></select></label>
        <label>Latest status<select id="filter-status"></select></label>
        <label>Latest difficulty<select id="filter-difficulty"></select></label>
        <label>Company<select id="filter-company"></select></label>
        <label>Tag<select id="filter-tag"></select></label>
        <label>Sort<select id="sort"></select></label>
        <label>Group<select id="group"></select></label>
        <button id="clear-filters" class="text-button" type="button">Clear filters</button>
      </div>
    </div>
    <div class="sidebar-heading"><span>PROBLEMS</span><span id="problem-count" class="count">0</span></div>
    <nav id="problem-list" class="problem-list" aria-label="Saved problems"><p class="muted sidebar-empty">Your saved problems will appear here.</p></nav>
    <div class="sidebar-footer">
      <div class="theme-switch" role="group" aria-label="Color theme">
        <button type="button" data-theme-choice="system" title="Match system">Auto</button>
        <button type="button" data-theme-choice="light" title="Light">Light</button>
        <button type="button" data-theme-choice="dark" title="Dark">Dark</button>
      </div>
      <div class="local-note"><span class="status-dot"></span> Saved in your repository</div>
    </div>
  </aside>

  <main>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <div id="view" class="view"><p class="muted loading">Loading…</p></div>
    <footer class="page-footer">A record of practice, one understood solution at a time.</footer>
  </main>
</body>
</html>
